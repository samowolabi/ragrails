services:
  ragrails-api:
    build:
      context: ../..
      dockerfile: docker/api/Dockerfile
    image: ragrails-api:local
    container_name: ragrails-api
    env_file:
      - path: ../env/api.env.example
      - path: ../env/api.env
        required: false
    environment:
      VECTOR_DB_PROVIDER: ${VECTOR_DB_PROVIDER:-qdrant}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-http://qdrant:6333}
      VECTOR_DB_COLLECTION: ${VECTOR_DB_COLLECTION:-rag_chunks}
    ports:
      - "${RAGRAILS_API_PORT:-8000}:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: ragrails-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
